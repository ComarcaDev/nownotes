[package]
name = "nownotes"
version = "2.0.1"
description = "Notas y tareas rápidas con recordatorios"
authors = ["hujeanpaes"]
license = "MIT"
repository = "https://github.com/hujeanpaes/nownotes"
edition = "2021"
rust-version = "1.87"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
chrono = "0.4"
# Ya lo incluye tauri-plugin-dialog; se usa para avisar si falla el arranque antes de crear ventanas.
rfd = { version = "0.17", default-features = false }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
